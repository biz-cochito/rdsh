[project]
name = "rdsh"
version = "0.1.0"
description = "Real-Debrid CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0"]

[project.scripts]
rdsh = "rdsh.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
